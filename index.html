                            <button onclick="executeUpdateGrade('${grade}')" class="flex-1 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md" style="background-color: var(--custom-btn);">Actualizar</button>
                        </div>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            app.appendChild(div);
        }

        function executeUpdateGrade(oldName) {
            const newName = document.getElementById('edit-grade-name').value.trim().toUpperCase();
            const color = document.getElementById('edit-grade-color').value;
            if (!newName) {
                showToast('⚠️ Ingrese un nombre válido.', 'warning');
                return;
            }

            const idx = STATE.gradesList.indexOf(oldName);
            if (idx !== -1) {
                STATE.gradesList[idx] = newName;
            }

            if (oldName !== newName) {
                STATE.gradeSolidColors[newName] = color;
                delete STATE.gradeSolidColors[oldName];
                STATE.sections[newName] = STATE.sections[oldName] || ['A'];
                delete STATE.sections[oldName];

                STATE.students.forEach(s => {
                    if (s.grade === oldName) s.grade = newName;
                });
            } else {
                STATE.gradeSolidColors[oldName] = color;
            }

            localStorage.setItem('qanill_grades_list', JSON.stringify(STATE.gradesList));
            localStorage.setItem('qanill_grade_colors', JSON.stringify(STATE.gradeSolidColors));
            localStorage.setItem('qanill_sections', JSON.stringify(STATE.sections));
            localStorage.setItem('qanill_students', JSON.stringify(STATE.students));

            document.getElementById('grade-modal').remove();
            showToast(`✅ Grado actualizado con éxito.`);
            renderSettings();
        }

        function updateSingleGradeColor(grade, color) {
            STATE.gradeSolidColors[grade] = color;
            localStorage.setItem('qanill_grade_colors', JSON.stringify(STATE.gradeSolidColors));
        }

        function deleteGrade(grade) {
            if (confirm(`¿Está seguro de eliminar el grado "${grade}"? Los alumnos asignados a este grado podrían quedar sin categoría.`)) {
                STATE.gradesList = STATE.gradesList.filter(g => g !== grade);
                delete STATE.gradeSolidColors[grade];
                delete STATE.sections[grade];

                localStorage.setItem('qanill_grades_list', JSON.stringify(STATE.gradesList));
                localStorage.setItem('qanill_grade_colors', JSON.stringify(STATE.gradeSolidColors));
                localStorage.setItem('qanill_sections', JSON.stringify(STATE.sections));

                showToast(`✅ Grado "${grade}" eliminado.`);
                renderSettings();
            }
        }

        function applyAndSaveColors() {
            STATE.colors.headerBg = document.getElementById('text-header').value || '#6c1d1d';
            STATE.colors.sidebarBg = document.getElementById('text-sidebar').value || '#82912d';
            STATE.colors.btnBg = document.getElementById('text-btn').value || '#EF6905';
            STATE.colors.iconColor = document.getElementById('text-icon').value || '#EF6905';
            STATE.colors.textColor = document.getElementById('text-textColor').value || '#f8fafc';

            localStorage.setItem('qanill_colors', JSON.stringify(STATE.colors));
            applyCustomColors();
            showToast('✅ Paleta de colores y iconos aplicada correctamente.');
            renderSettings();
        }

        function addNonWorkingRange() {
            const name = document.getElementById('nw-name').value.trim();
            const start = document.getElementById('nw-start').value;
            const end = document.getElementById('nw-end').value;
            if (!name || !start || !end) {
                showToast('⚠️ Complete todos los campos del período.', 'warning');
                return;
            }
            if (!STATE.nonWorkingRanges) STATE.nonWorkingRanges = [];
            STATE.nonWorkingRanges.push({ name, start, end });
            localStorage.setItem('qanill_non_working_ranges', JSON.stringify(STATE.nonWorkingRanges));
            showToast('✅ Período exento guardado correctamente.');
            renderSettings();
        }

        function removeNonWorkingRange(idx) {
            STATE.nonWorkingRanges.splice(idx, 1);
            localStorage.setItem('qanill_non_working_ranges', JSON.stringify(STATE.nonWorkingRanges));
            showToast('✅ Período eliminado.');
            renderSettings();
        }

        function uploadLogo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 120;
                    canvas.height = 120;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 120, 120);
                    STATE.logo = canvas.toDataURL('image/png', 0.9);
                    localStorage.setItem('qanill_logo', STATE.logo);
                    showToast('✅ Logotipo actualizado y optimizado.');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveSettings() {
            STATE.schoolName = document.getElementById('set-school').value;
            STATE.device = document.getElementById('set-device').value;
            STATE.timeLimit = document.getElementById('set-timelimit').value;
            STATE.activeCycle = document.getElementById('set-cycle').value;
            STATE.themeMode = document.getElementById('set-theme').value;
            STATE.includeWeekends = document.getElementById('set-weekends').checked;

            localStorage.setItem('qanill_school_name', STATE.schoolName);
            localStorage.setItem('qanill_device', STATE.device);
            localStorage.setItem('qanill_timelimit', STATE.timeLimit);
            localStorage.setItem('qanill_cycle', STATE.activeCycle);
            localStorage.setItem('qanill_theme', STATE.themeMode);
            localStorage.setItem('qanill_weekends', STATE.includeWeekends);

            const titleEl = document.getElementById('page-title');
            if (titleEl) titleEl.innerText = `${STATE.schoolName} – Control de Asistencia`;

            showToast('✅ Configuración guardada correctamente.');
            renderDashboard();
        }

        function updateNetworkStatus() {
            const badge = document.getElementById('network-badge');
            if (badge) badge.innerText = STATE.online ? '🟢 En Línea' : '🔴 Offline';
        }

        function syncOfflineData() {
            if (!STATE.online) {
                showToast('⚠️ No hay conexión a Internet para sincronizar.', 'warning');
                return;
            }
            if (STATE.pendingSync.length === 0) {
                showToast('No hay registros pendientes de sincronización.');
                return;
            }
            STATE.pendingSync = [];
            localStorage.removeItem('qanill_pending');
            showToast('✅ Sincronización completada con éxito.');
            renderDashboard();
        }
    </script>
</body>
</html>
