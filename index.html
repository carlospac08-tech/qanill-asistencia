<!DOCTYPE html>

        /* Tamaño exacto de Carné ID Horizontal CR80: 8.56 cm x 5.40 cm */

            height: 5.40cm;

<body class="h-full flex flex-col overflow-hidden">
    <!-- Contenedor de Notificaciones Toast -->

    <!-- APP ROOT CONTAINER -->
    <div id="app" class="flex-1 flex flex-col h-full w-full overflow-hidden relative"></div>

    <!-- SCRIPT PRINCIPAL DE LA APLICACIÓN -->
    <script>
        // CONFIGURACIÓN DE SUPABASE (Nube en tiempo real)
        const SUPABASE_URL = 'https://vejjewvznfnrtlopubs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cs3SLyKIvc4evF6xvcJheg_JqwNT...'; // Tu Publishable key
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Control de Versión
        const APP_VERSION = '1.3';
        if (localStorage.getItem('qanill_version') !== APP_VERSION) {
            localStorage.setItem('qanill_version', APP_VERSION);
        }

        // Estado Global de la Aplicación
        const STATE = {
            user: null,
            role: null, 
            device: localStorage.getItem('qanill_device') || 'Entrada Principal – Dispositivo 1',
            schoolName: localStorage.getItem('qanill_school_name') || "Eco School Q'anill",
            logo: localStorage.getItem('qanill_logo') || '',
            activeCycle: localStorage.getItem('qanill_cycle') || '2026',
            cycles: ["2026", "2027", "2028", "2029", "2030"],
            themeMode: localStorage.getItem('qanill_theme') || 'dark', 
            includeWeekends: localStorage.getItem('qanill_weekends') === 'true',
            
            splashBgColor: localStorage.getItem('qanill_splash_bg') || '#6c1d1d',
            splashTextColor: localStorage.getItem('qanill_splash_text') || '#ffffff',

            colors: JSON.parse(localStorage.getItem('qanill_colors') || JSON.stringify({
                headerBg: '#6c1d1d',
                sidebarBg: '#82912d',
                btnBg: '#EF6905',
                textColor: '#f8fafc',
                iconColor: '#EF6905'
            })),

            gradesList: JSON.parse(localStorage.getItem('qanill_grades_list') || JSON.stringify(['KD', 'PREPA', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'B1', 'B2', 'B3', 'B4 DG', 'B4 MD', 'B4 CM', 'B5 DG', 'B5 MD', 'B5 CM'])),

            gradeSolidColors: JSON.parse(localStorage.getItem('qanill_grade_colors') || JSON.stringify({
                'KD': '#8B2626', 'PREPA': '#D97706', 'P1': '#486C2F', 'P2': '#1E3A8A', 'P3': '#7C3AED', 'P4': '#0D9488', 'P5': '#BE185D', 'P6': '#C2410C', 'B1': '#15803D', 'B2': '#4338CA', 'B3': '#B45309', 'B4 DG': '#0369A1', 'B4 MD': '#6D28D9', 'B4 CM': '#9333EA', 'B5 DG': '#047857', 'B5 MD': '#B91C1C', 'B5 CM': '#B45309'
            })),

            sections: JSON.parse(localStorage.getItem('qanill_sections') || '{"KD":["A"], "PREPA":["A"], "P1":["A","B"], "P2":["A","B"], "P3":["A","B"], "P4":["A","B"], "P5":["A","B"], "P6":["A","B"], "B1":["A","B"], "B2":["A","B"], "B3":["A","B"], "B4 DG":["A"], "B4 MD":["A"], "B4 CM":["A"], "B5 DG":["A"], "B5 MD":["A"], "B5 CM":["A"]}'),
            students: [],
            attendance: [],
            excuses: JSON.parse(localStorage.getItem('qanill_excuses') || '{}'),
            specialSchedules: JSON.parse(localStorage.getItem('qanill_special_schedules') || '{}'),
            nonWorkingRanges: JSON.parse(localStorage.getItem('qanill_non_working_ranges') || '[]'),
            online: navigator.onLine
        };

        let dashboardChartInstance = null;

        function applyCustomColors() {
            const root = document.documentElement;
            root.style.setProperty('--custom-header', STATE.colors.headerBg);
            root.style.setProperty('--custom-sidebar', STATE.colors.sidebarBg);
            root.style.setProperty('--custom-btn', STATE.colors.btnBg);
            root.style.setProperty('--custom-text', STATE.colors.textColor);
            root.style.setProperty('--custom-icon', STATE.colors.iconColor || STATE.colors.btnBg);
        }

        function getThemeClasses() {
            applyCustomColors();
            if (STATE.themeMode === 'light') {
                return {
                    body: 'bg-slate-100 text-slate-900',
                    card: 'bg-white border-slate-300 text-slate-900 shadow-sm',
                    cardAlt: 'bg-white border-slate-200 text-slate-900 shadow-md',
                    input: 'bg-slate-50 border-slate-300 text-slate-900',
                    textMuted: 'text-slate-600',
                    tableHeader: 'bg-slate-100 text-slate-700 border-slate-300',
                    tableRow: 'border-slate-200 hover:bg-slate-50'
                };
            } else {
                return {
                    body: 'bg-slate-900 text-slate-100',
                    card: 'bg-slate-800/80 border-slate-700/60 text-slate-100 shadow-xl',
                    cardAlt: 'bg-slate-800 border-slate-700 text-slate-100 shadow-xl',
                    input: 'bg-slate-900 border-slate-700 text-white',
                    textMuted: 'text-slate-400',
                    tableHeader: 'bg-slate-800/80 text-slate-400 border-slate-700',
                    tableRow: 'border-slate-800 hover:bg-slate-800/30'
                };
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-[#486C2F] text-white' : (type === 'error' ? 'bg-[#8B2626] text-white' : 'bg-[#EF6905] text-white');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-sm font-semibold flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info')}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('online', () => { STATE.online = true; updateNetworkStatus(); });
        window.addEventListener('offline', () => { STATE.online = false; updateNetworkStatus(); });

        document.addEventListener('DOMContentLoaded', async () => {
            applyCustomColors();
            initServiceWorker();
            await loadDataFromCloud();
            subscribeToRealtimeAttendance();
            renderSplashWelcome();
        });

        // --- CARGA Y SINCRONIZACIÓN CON SUPABASE ---
        async function loadDataFromCloud() {
            try {
                const { data: studentsData, error: errSt } = await supabaseClient.from('students').select('*');
                if (!errSt && studentsData && studentsData.length > 0) {
                    STATE.students = studentsData.map(s => ({
                        id: s.id,
                        names: s.names,
                        lastNames: s.last_names,
                        grade: s.grade,
                        section: s.section || 'A',
                        jornada: s.jornada || 'Matutina',
                        status: s.status || 'activo',
                        photo: s.photo || ''
                    }));
                } else if (STATE.students.length === 0) {
                    STATE.students = [
                        { id: 'QAN-2026-1001', names: 'Carlos Eduardo', lastNames: 'López Gómez', grade: 'B5 DG', section: 'A', jornada: 'Matutina', status: 'activo', photo: '' },
                        { id: 'QAN-2026-1002', names: 'María Fernanda', lastNames: 'Morales Ruiz', grade: 'B5 DG', section: 'A', jornada: 'Matutina', status: 'activo', photo: '' }
                    ];
                }

                const today = new Date().toISOString().split('T')[0];
                const { data: attendanceData, error: errAtt } = await supabaseClient.from('attendance').select('*').eq('date', today);
                if (!errAtt && attendanceData) {
                    STATE.attendance = attendanceData.map(a => ({
                        id: a.student_id,
                        date: a.date,
                        time: a.time,
                        status: a.status,
                        type: a.type,
                        device: a.device,
                        user: a.user_role,
                        cycle: a.cycle
                    }));
                }
            } catch (e) {
                console.error('Error conectando a Supabase:', e);
            }
        }

        function subscribeToRealtimeAttendance() {
            try {
                supabaseClient
                    .channel('schema-db-changes')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, payload => {
                        const newRecord = payload.new;
                        const today = new Date().toISOString().split('T')[0];
                        if (newRecord.date === today) {
                            const exists = STATE.attendance.some(a => a.id === newRecord.student_id && a.date === newRecord.date && a.cycle === newRecord.cycle);
                            if (!exists) {
                                STATE.attendance.push({
                                    id: newRecord.student_id,
                                    date: newRecord.date,
                                    time: newRecord.time,
                                    status: newRecord.status,
                                    type: newRecord.type,
                                    device: newRecord.device,
                                    user: newRecord.user_role,
                                    cycle: newRecord.cycle
                                });
                                playSound('success');
                                showToast(`🔔 Nueva marcación desde ${newRecord.device}`);
                                if (document.getElementById('dashboard-chart-canvas')) {
                                    renderDashboard();
                                }
                            }
                        }
                    })
                    .subscribe();
            } catch(e) {}
        }

        async function saveAttendanceRecordToCloud(record) {
            try {
                await supabaseClient.from('attendance').insert([{
                    student_id: record.id,
                    date: record.date,
                    time: record.time,
                    status: record.status,
                    type: record.type,
                    device: record.device,
                    user_role: record.user,
                    cycle: record.cycle
                }]);
            } catch(e) {
                console.error('Error al guardar en nube:', e);
            }
        }

        async function saveStudentToCloud(student) {
            try {
                await supabaseClient.from('students').upsert([{
                    id: student.id,
                    names: student.names,
                    last_names: student.lastNames,
                    grade: student.grade,
                    section: student.section,
                    jornada: student.jornada,
                    status: student.status,
                    photo: student.photo
                }]);
            } catch(e) {
                console.error('Error al guardar estudiante en nube:', e);
            }
        }

        async function deleteStudentFromCloud(id) {
            try {
                await supabaseClient.from('students').delete().eq('id', id);
            } catch(e) {}
        }

        async function deleteAttendanceFromCloud(studentId, date) {
            try {
                await supabaseClient.from('attendance').delete().eq('student_id', studentId).eq('date', date);
            } catch(e) {}
        }

        function initServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'success') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        // --- SPLASH SCREEN ---

                    <div class="w-24 h-24 rounded-3xl flex items-center justify-center shadow-2xl mb-6 animate-bounce bg-white/10 backdrop-blur-md border border-white/20 overflow-hidden">
                        ${STATE.logo ? `<img src="${STATE.logo}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-graduation-cap text-5xl" style="color: ${STATE.splashTextColor};"></i>`}

                    <div class="mt-8 w-48 bg-black/30 h-2 rounded-full overflow-hidden mx-auto border border-white/20">

                        Ciclo Escolar Activo: <span class="font-bold">${STATE.activeCycle}</span>

                </div>

            setTimeout(() => {
                const bar = document.getElementById('loading-bar');

            setTimeout(() => {
                renderLogin();

        // --- AUTENTICACIÓN ---
        function renderLogin() {
            const t = getThemeClasses();
            const app = document.getElementById('app');
            document.body.className = `h-full flex flex-col overflow-hidden ${t.body}`;
            app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6" style="background-color: var(--custom-sidebar); opacity: 0.15;"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center p-6 pointer-events-none">

                        <div class="text-center mb-8">
                            ${STATE.logo ? `<img src="${STATE.logo}" class="w-16 h-16 object-cover rounded-2xl mx-auto mb-4 shadow-lg">` : `
                            <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-4 text-white" style="background-color: var(--custom-sidebar);">

                        </div>

                            <div>
                                <label class="block text-xs font-medium mb-1">Rol de Usuario</label>
                                <select id="login-role" class="w-full ${t.input} border rounded-xl px-4 py-3 text-sm focus:outline-none">

        }

        function handleLogin() {
            const role = document.getElementById('login-role').value;
            const device = document.getElementById('login-device').value.trim();
            if (device) {
                STATE.device = device;
                localStorage.setItem('qanill_device', device);
            }
            STATE.role = role;
            STATE.user = role === 'admin' ? 'Administrador' : 'Personal de Control';
            renderDashboard();
        }

        function toggleThemeMode() {
            STATE.themeMode = STATE.themeMode === 'dark' ? 'light' : 'dark';
            localStorage.setItem('qanill_theme', STATE.themeMode);
            renderDashboard();
        }

        // --- DASHBOARD PRINCIPAL ---
        function renderDashboard() {
            const t = getThemeClasses();
            document.body.className = `h-full flex flex-col overflow-hidden ${t.body}`;
            const today = new Date().toISOString().split('T')[0];
            const todayAttendance = STATE.attendance.filter(a => a.date === today && a.cycle === STATE.activeCycle);
            const totalStudents = STATE.students.filter(s => s.status === 'activo').length;
            const attended = todayAttendance.length;
            const punctual = todayAttendance.filter(a => a.status === 'puntual').length;
            const late = todayAttendance.filter(a => a.status === 'tarde').length;
            const absent = Math.max(0, totalStudents - attended);
            const percentage = totalStudents > 0 ? ((attended / totalStudents) * 100).toFixed(1) : 0;

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex flex-col h-full overflow-hidden ${t.body}">
                    <header class="border-b px-4 md:px-6 py-3 flex items-center justify-between shrink-0 shadow-md" style="background-color: var(--custom-header); color: var(--custom-text);">
                        <div class="flex items-center space-x-3">
                            ${STATE.logo ? `<img src="${STATE.logo}" class="w-10 h-10 object-cover rounded-xl">` : `

                                <i class="fa-solid fa-leaf" style="color: var(--custom-icon);"></i>
                            </div>`}
                            <div>
                                <h1 class="text-sm md:text-base font-bold">${STATE.schoolName}</h1>
                                <p class="text-[11px] md:text-xs opacity-90">${STATE.device} • <span id="network-badge">${STATE.online ? '🟢 Nube Conectada' : '🔴 Offline'}</span></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">

                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="theme-switch" onchange="toggleThemeMode()" class="sr-only peer" ${STATE.themeMode === 'light' ? 'checked' : ''}>
                                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all"></div>
                                </label>

        function toggleDashboardChartMode(mode) {
            const wrapper = document.getElementById('chart-student-select-wrapper');
            if (mode === 'estudiante') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
            updateDashboardChart();
        }

        function updateDashboardChart() {
            const ctx = document.getElementById('dashboard-chart-canvas');
            if (!ctx) return;
            const mode = document.getElementById('chart-mode')?.value || 'grado';
            const isLight = STATE.themeMode === 'light';
            const textColor = isLight ? '#1e293b' : '#f8fafc';
            const gridColor = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';

            if (dashboardChartInstance) {
                dashboardChartInstance.destroy();
            }

            if (mode === 'grado') {
                const labels = STATE.gradesList;
                const puntualesData = [];
                const tardesData = [];
                const ausentesData = [];
                const today = new Date().toISOString().split('T')[0];

                labels.forEach(g => {
                    const gradeStudents = STATE.students.filter(s => s.grade === g && s.status === 'activo');
                    let p = 0, t = 0, a = 0;

                    gradeStudents.forEach(st => {
                        const rec = STATE.attendance.find(att => att.id === st.id && att.date === today && att.cycle === STATE.activeCycle);
                        if (rec) {
                            if (rec.status === 'puntual') p++;
                            else if (rec.status === 'tarde') t++;
                        } else {
                            a++;
                        }
                    });

                    puntualesData.push(p);
                    tardesData.push(t);
                    ausentesData.push(a);
                });

                dashboardChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Puntuales', data: puntualesData, backgroundColor: '#486C2F', borderRadius: 6 },
                            { label: 'Tarde', data: tardesData, backgroundColor: STATE.colors.btnBg, borderRadius: 6 },
                            { label: 'Ausentes', data: ausentesData, backgroundColor: '#8B2626', borderRadius: 6 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: textColor, font: { family: 'Plus Jakarta Sans', weight: 'bold' } } }
                        },
                        scales: {
                            x: { ticks: { color: textColor }, grid: { color: gridColor } },
                            y: { ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor }, beginAtZero: true }
                        }
                    }
                });
            } else {
                const studentId = document.getElementById('chart-student-id')?.value || STATE.students[0]?.id;
                const student = STATE.students.find(s => s.id === studentId);
                let pCount = 0, tCount = 0;
                const studentRecords = STATE.attendance.filter(a => a.id === studentId && a.cycle === STATE.activeCycle);
                
                studentRecords.forEach(r => {
                    if (r.status === 'puntual') pCount++;
                    else if (r.status === 'tarde') tCount++;
                });

                dashboardChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Asistencias Puntuales', 'Llegadas Tarde'],
                        datasets: [{
                            data: [pCount, tCount],
                            backgroundColor: ['#486C2F', STATE.colors.btnBg],
                            borderWidth: 2,
                            borderColor: isLight ? '#ffffff' : '#1e293b'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: textColor, font: { family: 'Plus Jakarta Sans', weight: 'bold' } } },
                            title: { display: true, text: `Historial de ${student ? student.names + ' ' + student.lastNames : 'Estudiante'}`, color: textColor }
                        }
                    }
                });
            }
        }

        // --- ESCANEO QR ---
        let scannerActive = false;
        let videoStream = null;
        let lastScannedCode = '';
        let lastScanTime = 0;

        function renderScanner() {
            const t = getThemeClasses();
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex flex-col h-full overflow-hidden ${t.body}">
                    <header class="border-b px-4 md:px-6 py-3 flex items-center justify-between shrink-0 shadow-md" style="background-color: var(--custom-header); color: var(--custom-text);">
                        <div class="flex items-center space-x-3">
                            <button onclick="stopCamera(); renderDashboard();" class="mr-2"><i class="fa-solid fa-arrow-left text-lg"></i></button>

                        <span class="text-xs bg-[#486C2F]/20 text-[#F1E5A1] px-3 py-1 rounded-full font-semibold">Límite Hoy: ${getEffectiveTimeLimit(new Date().toISOString().split('T')[0])} AM</span>
                    </header>
                    <main class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col items-center justify-center max-w-xl mx-auto w-full pb-24 md:pb-6">
                        <div class="w-full ${t.card} border rounded-3xl p-6 shadow-xl text-center">
                            <div id="scanner-container" class="relative w-full h-64 bg-black rounded-2xl overflow-hidden mb-6 flex items-center justify-center border border-slate-700">
                                <video id="qr-video" class="w-full h-full object-cover" autoplay playsinline></video>
                                <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-4">
                                    <i class="fa-solid fa-camera text-4xl mb-2 animate-pulse" style="color: var(--custom-icon);"></i>
                                    <p class="text-sm">Cámara inactiva. Presione activar para iniciar el escaneo QR.</p>
                                </div>
                            </div>
                            <div class="flex space-x-3 mb-6">
                                <button onclick="startCamera()" class="flex-1 text-white font-semibold py-3 rounded-xl shadow-md transition" style="background-color: var(--custom-btn);">
                                    <i class="fa-solid fa-play mr-2"></i> Activar Cámara
                                </button>
                                <button onclick="stopCamera()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl shadow-md transition">
                                    <i class="fa-solid fa-stop mr-2"></i> Apagar
                                </button>
                            </div>
                            <div class="border-t border-slate-700/50 pt-4">
                                <label class="block text-xs font-medium ${t.textMuted} mb-2">Simulador de Código de Carné:</label>
                                <div class="flex space-x-2">
                                    <input type="text" id="sim-code" placeholder="Ej. QAN-2026-1001" class="flex-1 ${t.input} border rounded-xl px-4 py-2.5 text-sm focus:outline-none">
                                    <button onclick="processScanCode(document.getElementById('sim-code').value)" class="text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition" style="background-color: var(--custom-btn);">
                                        Simular
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function startCamera() {
            if (scannerActive) return;
            const video = document.getElementById('qr-video');
            const placeholder = document.getElementById('scanner-placeholder');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                    video.setAttribute('playsinline', true);
                    video.play();
                    scannerActive = true;
                    if (placeholder) placeholder.style.display = 'none';
                    requestAnimationFrame(tickScanner);
                })
                .catch(err => showToast('No se pudo acceder a la cámara: ' + err.message, 'error'));
        }

        function stopCamera() {
            scannerActive = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            const placeholder = document.getElementById('scanner-placeholder');
            if (placeholder) placeholder.style.display = 'flex';
        }

        function tickScanner() {
            if (!scannerActive) return;
            const video = document.getElementById('qr-video');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    const nowTime = Date.now();
                    if (code.data !== lastScannedCode || (nowTime - lastScanTime > 3000)) {
                        lastScannedCode = code.data;
                        lastScanTime = nowTime;
                        processScanCode(code.data);
                    }
                    scannerActive = false;
                    setTimeout(() => {
                        if (videoStream) scannerActive = true;
                        requestAnimationFrame(tickScanner);
                    }, 1500);
                    return;
                }
            }
            if (scannerActive) requestAnimationFrame(tickScanner);
        }

        function isNonWorkingDate(dateStr) {
            const ranges = STATE.nonWorkingRanges || [];
            const d = new Date(dateStr);
            if (!STATE.includeWeekends) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) return true;
            }
            for (let r of ranges) {
                const start = new Date(r.start);
                const end = new Date(r.end);
                if (d >= start && d <= end) return true;
            }
            return false;
        }

        function getEffectiveTimeLimit(dateStr) {
            if (STATE.specialSchedules && STATE.specialSchedules[dateStr]) {
                return STATE.specialSchedules[dateStr];
            }
            return STATE.timeLimit || '07:10';
        }

        async function processScanCode(code) {
            code = code.trim();
            const today = new Date().toISOString().split('T')[0];
            const d = new Date(today);

            if (!STATE.includeWeekends && (d.getDay() === 0 || d.getDay() === 6)) {
                playSound('error');
                showToast('⚠️ Fin de semana (asistencias desactivadas).', 'warning');
                return;
            }

            if (isNonWorkingDate(today)) {
                playSound('error');
                showToast('⚠️ Período de asueto configurado.', 'warning');
                return;
            }

            const student = STATE.students.find(s => s.id === code && s.status === 'activo');
            if (!student) {
                playSound('error');
                showToast('⚠️ Estudiante no encontrado o inactivo: ' + code, 'error');
                return;
            }

            const already = STATE.attendance.find(a => a.id === student.id && a.date === today && a.cycle === STATE.activeCycle);
            if (already) {
                playSound('error');
                showToast(`⚠️ ${student.names} ya registró asistencia hoy a las ${already.time}.`, 'warning');
                return;
            }

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const [h, m] = timeStr.split(':').map(Number);
            
            const effectiveLimit = getEffectiveTimeLimit(today);
            const [limitH, limitM] = effectiveLimit.split(':').map(Number);
            const status = (h * 60 + m) <= (limitH * 60 + limitM) ? 'puntual' : 'tarde';

            const record = {
                id: student.id,
                date: today,
                time: timeStr,
                status: status,
                type: 'escaneo',
                device: STATE.device,
                user: STATE.user,
                cycle: STATE.activeCycle
            };

            STATE.attendance.push(record);
            await saveAttendanceRecordToCloud(record);
            playSound('success');

            showSuccessModal(student, record);
        }

        function showSuccessModal(student, record) {

            const app = document.getElementById('app');
            const modalHTML = `
                <div id="scan-success-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                    <div class="${t.card} border rounded-3xl p-6 max-w-md w-full text-center shadow-2xl">

                        <div class="bg-black/20 rounded-2xl p-4 mb-6 flex items-center space-x-4 text-left">

                                <p class="text-xs text-[#486C2F] font-semibold mt-1">Grado: ${student.grade} "${student.section}" • ${record.time}</p>
                                <span class="inline-block mt-2 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${record.status === 'puntual' ? 'bg-[#486C2F]/20 text-[#486C2F]' : 'bg-[#EF6905]/20 text-[#EF6905]'}">
                                    ${record.status.toUpperCase()}
                                </span>
                            </div>
                        </div>
                        <button onclick="document.getElementById('scan-success-modal').remove()" class="w-full text-white font-semibold py-3 rounded-xl shadow-md transition" style="background-color: var(--custom-btn);">
                            Continuar Escaneando
                        </button>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            app.appendChild(div);
            setTimeout(() => {

                if (m) m.remove();
            }, 2000);

        // --- REGISTRO MANUAL ---

        async function processManualRecord(id) {
            const today = new Date().toISOString().split('T')[0];
            const d = new Date(today);

            if (!STATE.includeWeekends && (d.getDay() === 0 || d.getDay() === 6)) {
                showToast('⚠️ Fin de semana (asistencias desactivadas).', 'warning');
                return;
            }

            if (isNonWorkingDate(today)) {
                showToast('⚠️ Período no laborable configurado.', 'warning');
                return;
            }

            const student = STATE.students.find(s => s.id === id);
            const already = STATE.attendance.find(a => a.id === student.id && a.date === today && a.cycle === STATE.activeCycle);
            if (already) {
                showToast(`⚠️ El estudiante ya tiene registrada su asistencia hoy a las ${already.time}.`, 'warning');
                return;
            }

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const [h, m] = timeStr.split(':').map(Number);
            
            const effectiveLimit = getEffectiveTimeLimit(today);
            const [limitH, limitM] = effectiveLimit.split(':').map(Number);
            const status = (h * 60 + m) <= (limitH * 60 + limitM) ? 'puntual' : 'tarde';

            const record = {
                id: student.id,
                date: today,
                time: timeStr,
                status: status,
                type: 'manual',
                device: STATE.device,
                user: STATE.user,
                cycle: STATE.activeCycle
            };

            STATE.attendance.push(record);
            await saveAttendanceRecordToCloud(record);
            playSound('success');
            
            showToast(`✅ Asistencia manual registrada para ${student.names} (${status.toUpperCase()})`);
            renderManual();
        }

        function processBulkUpload() {
            const fileInput = document.getElementById('bulk-file');
            if (!fileInput.files[0]) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                    for (let row of json) {
                        const names = String(row.Nombres || row.nombres || '').trim();
                        const lastNames = String(row.Apellidos || row.apellidos || '').trim();
                        const grade = String(row.Grado || row.grado || STATE.gradesList[0]).trim();
                        const section = String(row.Seccion || row.sección || 'A').trim();
                        const jornada = row.Jornada || row.jornada || 'Matutina';

                        if (names && lastNames) {
                            const newId = `QAN-${STATE.activeCycle}-${Math.floor(1000 + Math.random() * 9000)}`;
                            const newSt = { id: newId, names, lastNames, grade, section, jornada, status: 'activo', photo: '' };
                            STATE.students.push(newSt);
                            await saveStudentToCloud(newSt);
                        }
                    }
                    document.getElementById('bulk-modal').remove();
                    showToast('✅ Carga masiva sincronizada con la nube.');
                    renderStudents();
                } catch(err) {
                    showToast('⚠️ Error al leer archivo: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        function generateAndPrintCards() {
            const mode = document.getElementById('print-mode').value;
            let targetList = STATE.students.filter(s => s.status === 'activo');
            if (mode === 'grade') {
                const g = document.getElementById('target-grade').value;

            document.getElementById('print-selector-modal').remove();

            let container = document.createElement('div');
            container.id = 'printable-card-area';
            container.style.display = 'flex';
            container.style.flexWrap = 'wrap';
            container.style.justifyContent = 'center';
            container.style.gap = '15px';
            container.style.width = '100%';
            container.style.background = '#ffffff';

            container.innerHTML = targetList.map(s => `
                <div class="id-card-horizontal" style="width:8.56cm; height:5.40cm; border:2px solid #8B2626; border-radius:8px; padding:10px; display:flex; flex-direction:column; justify-content:space-between; page-break-inside:avoid;">

                        <div style="width:55px; height:55px; background:#F1E5A1; border-radius:8px; overflow:hidden;">
                            ${s.photo ? `<img src="${s.photo}" style="width:100%;height:100%;object-fit:cover;">` : ''}

                        <div style="flex:1; overflow:hidden;">
                            <h4 style="font-size:11px; font-weight:bold; margin:0;">${s.names}</h4>

                            <span style="font-size:9px; background:#486C2F; color:white; padding:1px 5px; border-radius:999px;">${s.grade} "${s.section}"</span>
                        </div>
                        <div id="print-qr-${s.id}"></div>
                    </div>
                </div>
            `).join('');

            document.body.appendChild(container);
            targetList.forEach(s => {
                try {
                    const qr = qrcode(0, 'M');
                    qr.addData(s.id);
                    qr.make();
                    document.getElementById(`print-qr-${s.id}`).innerHTML = qr.createSvgTag({cellSize: 3, margin: 0});
                } catch(e) {}
            });

            setTimeout(() => {
                window.print();
                setTimeout(() => container.remove(), 1000);
            }, 500);
        }

                        </div>
                        <form onsubmit="saveStudent(event, '${id || ''}')" class="space-y-4">
                            <input type="text" id="modal-names" required placeholder="Nombres" value="${student ? student.names : ''}" class="w-full ${t.input} border rounded-xl px-4 py-2.5 text-sm">
                            <input type="text" id="modal-lastnames" required placeholder="Apellidos" value="${student ? student.lastNames : ''}" class="w-full ${t.input} border rounded-xl px-4 py-2.5 text-sm">
                            <select id="modal-grade" class="w-full ${t.input} border rounded-xl px-3 py-2.5 text-sm">
                                ${STATE.gradesList.map(g => `<option value="${g}" ${student && student.grade === g ? 'selected' : ''}>${g}</option>`).join('')}
                            </select>
                            <input type="file" accept="image/*" onchange="previewAndCompressPhoto(event)" class="w-full text-xs">
                            <button type="submit" class="w-full text-white font-semibold py-3 rounded-xl shadow-md" style="background-color: var(--custom-btn);">Guardar</button>
                        </form>
                    </div>
                </div>
            `;
        }

        let tempPhotoBase64 = '';
        function previewAndCompressPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 150; canvas.height = 150;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 150, 150);
                    tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveStudent(event, existingId) {
            event.preventDefault();
            const names = document.getElementById('modal-names').value.trim();
            const lastNames = document.getElementById('modal-lastnames').value.trim();
            const grade = document.getElementById('modal-grade').value;

            if (existingId) {
                const s = STATE.students.find(st => st.id === existingId);
                s.names = names; s.lastNames = lastNames; s.grade = grade;
                if (tempPhotoBase64) s.photo = tempPhotoBase64;
                await saveStudentToCloud(s);
            } else {
                const newId = `QAN-${STATE.activeCycle}-${Math.floor(1000 + Math.random() * 9000)}`;
                const newSt = { id: newId, names, lastNames, grade, section: 'A', jornada: 'Matutina', status: 'activo', photo: tempPhotoBase64 };
                STATE.students.push(newSt);
                await saveStudentToCloud(newSt);
            }
            tempPhotoBase64 = '';
            showToast('✅ Estudiante guardado en la nube.');
            renderStudents();
        }

        function previewIDCard(id) {
            const s = STATE.students.find(st => st.id === id);
            openStudentModal(id);
        }

        // --- REPORTES ---
        function renderReports() {
            const t = getThemeClasses();
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex flex-col h-full overflow-hidden ${t.body}">
                    <header class="border-b px-4 md:px-6 py-3 flex items-center justify-between shrink-0 shadow-md" style="background-color: var(--custom-header); color: var(--custom-text);">
                        <div class="flex items-center space-x-3">
                            <button onclick="renderDashboard()" class="mr-2"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                            <h1 class="text-sm md:text-base font-bold">Reportes en la Nube</h1>
                        </div>
                        <button onclick="exportToExcel()" class="text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md" style="background-color: var(--custom-btn);">Excel</button>
                    </header>
                    <main class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 pb-24">
                        <div class="${t.card} border p-6 rounded-3xl">
                            <p class="text-xs opacity-75">Visualiza todos los registros sincronizados en tiempo real desde cualquier dispositivo conectado.</p>
                        </div>
                    </main>
                </div>
            `;
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(STATE.attendance);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Asistencia");
            XLSX.writeFile(wb, `Reporte_Asistencia_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // --- CONFIGURACIÓN ---
        function renderSettings() {
            const t = getThemeClasses();
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex flex-col h-full overflow-hidden ${t.body}">
                    <header class="border-b px-4 md:px-6 py-3 flex items-center justify-between shrink-0 shadow-md" style="background-color: var(--custom-header); color: var(--custom-text);">
                        <div class="flex items-center space-x-3">
                            <button onclick="renderDashboard()" class="mr-2"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                            <h1 class="text-sm md:text-base font-bold">Configuración</h1>
                        </div>
                    </header>
                    <main class="flex-1 p-4 md:p-6 overflow-y-auto max-w-2xl mx-auto w-full space-y-6 pb-24">
                        <div class="${t.card} border p-6 rounded-3xl space-y-4">
                            <h3 class="font-bold">Identidad Institucional</h3>
                            <input type="text" id="set-school" value="${STATE.schoolName}" class="w-full ${t.input} border rounded-xl px-4 py-2.5 text-sm">
                            <input type="text" id="set-device" value="${STATE.device}" class="w-full ${t.input} border rounded-xl px-4 py-2.5 text-sm">
                            <button onclick="saveSettings()" class="w-full text-white font-semibold py-3 rounded-xl shadow-md" style="background-color: var(--custom-btn);">Guardar Cambios</button>
                        </div>
                    </main>
                </div>
            `;
        }

        function saveSettings() {
            STATE.schoolName = document.getElementById('set-school').value;
            STATE.device = document.getElementById('set-device').value;
            localStorage.setItem('qanill_school_name', STATE.schoolName);
            localStorage.setItem('qanill_device', STATE.device);
            showToast('✅ Configuración guardada.');
            renderDashboard();
        }

        function updateNetworkStatus() {
            const badge = document.getElementById('network-badge');
            if (badge) badge.innerText = STATE.online ? '🟢 Nube Conectada' : '🔴 Offline';
        }
    </script>
</body>
</html>
